name: Compilar APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compilar QuickJS (motor JavaScript que yt-dlp necesita para YouTube)
        run: |
          git clone --depth 1 --branch v0.18.0 https://github.com/quickjs-ng/quickjs qjs-src
          NDK="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          echo "NDK: $NDK"
          for abi in arm64-v8a armeabi-v7a; do
            cmake -S qjs-src -B "qjs-build-$abi" \
              -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
              -DANDROID_ABI=$abi -DANDROID_PLATFORM=android-29 -DCMAKE_BUILD_TYPE=Release
            cmake --build "qjs-build-$abi" --target qjs_exe -j4
            mkdir -p "app/src/main/jniLibs/$abi"
            cp "qjs-build-$abi/qjs" "app/src/main/jniLibs/$abi/libqjs.so"
          done
          file app/src/main/jniLibs/*/libqjs.so
      - name: Compilar
        run: gradle :app:assembleRelease --stacktrace
      - name: Preparar APK
        run: cp app/build/outputs/apk/release/app-release.apk Ember.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Ember
          path: Ember.apk
      - name: Publicar versión
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v4.1.${{ github.run_number }}
          name: Ember 4.1.${{ github.run_number }}
          files: Ember.apk
          make_latest: true
