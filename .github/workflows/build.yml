name: Compilar APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compilar
        run: gradle :app:assembleRelease --stacktrace
      - name: Preparar APK
        run: cp app/build/outputs/apk/release/app-release.apk LinkAMp3.apk
      - uses: actions/upload-artifact@v4
        with:
          name: LinkAMp3
          path: LinkAMp3.apk
      - name: Publicar versión
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Link a MP3 1.0.${{ github.run_number }}
          files: LinkAMp3.apk
          make_latest: true
